name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install check dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q cli.py src
      - name: Check CLI startup
        run: python cli.py --help
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

  processor-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/processor/requirements.txt
      - name: Install processor-only dependencies
        run: python -m pip install -r src/processor/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check processor imports and blank tokenizer
        run: python -c "import spacy; import src.processor.formart_data; spacy.blank('xx')"
      - name: Test processor confidence filtering
        run: python -m unittest discover -s tests/processor -v
